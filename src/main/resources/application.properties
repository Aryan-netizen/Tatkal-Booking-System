spring.application.name=Tatkal

#spring.datasource.url=jdbc:mysql://localhost:3306/tatkal
#spring.datasource.username=root
#spring.datasource.password=root


spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:10000}
server.address=0.0.0.0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Force Hikari to fail fast if the database is unreachable
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-timeout=5000


